<!DOCTYPE html>
<!-- Driven by tools/check_app.py. Opens every tool of the app in a frame the
     size of the target phone, checks its layout and console, plays the
     reference cases in tools/check_cases.js, and writes a JSON report into
     #report for the script to read. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Circuit Codex — check</title>
<style>
  body { margin: 0; background: #0B0D10; color: #ccc; font: 12px monospace; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
<iframe id="app" width="430" height="932" src="../index.html#/home"></iframe>
<pre id="report"></pre>
<script src="../js/data.js"></script>
<script src="check_cases.js"></script>
<script>
const frame = document.getElementById("app");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// Every tool that has a calculator, in the app's own order, with its route.
function tools() {
  const out = [];
  DOMAINS.forEach((d) => d.sections.forEach((s, si) => s.tools.forEach((t, ti) => {
    if (t.calc) out.push({ calc: t.calc, name: t.name, route: `${d.id}:${si}:${ti}` });
  })));
  return out;
}

// The first thing on screen that is an answer. A tool whose screen has none
// (a pure reference table) is not held to the above-the-tab-bar rule.
const RESULT_SELECTORS = [".result-field", "[data-res=\"results\"]", ".eseries-grid", "[data-res=\"table\"]", "[data-res=\"summary\"]"];

function firstResult(doc) {
  const all = RESULT_SELECTORS.flatMap((s) => [...doc.querySelectorAll(s)]);
  all.sort((a, b) => (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1));
  return all.find((el) => el.getBoundingClientRect().height > 0) || null;
}

function fire(el, type) { el.dispatchEvent(new Event(type, { bubbles: true })); }

// A step is ["set", selector, value], ["click", selector] or ["pill", index].
async function play(doc, steps) {
  for (const [kind, a, b] of steps) {
    if (kind === "pill") { doc.querySelectorAll(".pill")[a].click(); await wait(30); continue; }
    if (kind === "reopen") {
      const h = frame.contentWindow.location.hash;
      frame.contentWindow.location.hash = "#/home";
      await wait(40);
      frame.contentWindow.location.hash = h;
      await wait(80);
      continue;
    }
    const el = doc.querySelector(a);
    if (!el) throw new Error(`no element ${a}`);
    if (kind === "click") { el.click(); await wait(30); continue; }
    el.value = b;
    fire(el, "input");
    fire(el, "change");
    await wait(20);
  }
}

function matches(actual, expected) {
  if (expected.startsWith("/")) return new RegExp(expected.slice(1, -1)).test(actual);
  return actual === expected;
}

async function checkTool(t) {
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const errors = [];
  win.__errors = errors;
  win.localStorage.removeItem("cc_prefs");
  win.location.hash = `#/tool/${encodeURIComponent(t.route)}/${t.calc}`;
  await wait(120);

  const r = { calc: t.calc, name: t.name, problems: [], cases: 0, failed: [] };
  const h1 = doc.querySelector(".topbar h1");
  if (!h1 || h1.textContent.trim() !== t.name) r.problems.push(`did not open (title "${h1 ? h1.textContent.trim() : ""}")`);

  const sw = doc.documentElement.scrollWidth, w = win.innerWidth;
  if (sw > w + 1) r.problems.push(`page is ${sw - w} px wider than the screen`);

  // A tool with related tools must show them (a screen that skips
  // calcFooter would drop the links silently).
  const hasRelated = typeof win.relatedTools === "function" && win.relatedTools(t.calc).length;
  if (hasRelated && !doc.querySelector(".chip-row.related")) r.problems.push("related tools not shown");

  // Text cut off inside a card: a value wider than its cell.
  const clipped = [...doc.querySelectorAll(".eseries-cell, .result-value, .field-row")]
    .filter((el) => el.getBoundingClientRect().height > 0 && el.scrollWidth > el.clientWidth + 1);
  if (clipped.length) r.problems.push(`${clipped.length} box(es) with text wider than the box: "${clipped[0].textContent.trim().slice(0, 30)}"`);

  // Drawing text, as rendered: size after the SVG's own scaling, contrast
  // against the drawing box, labels that overlap each other, and text cut by
  // the drawing's edge. All four fail the check.
  r.notes = r.problems;
  const lum = (c) => {
    const rgb = /rgb\((\d+), (\d+), (\d+)\)/.exec(c || "");
    const m = rgb ? null : /^#?([0-9a-f]{6})$/i.exec(c || "");
    if (!rgb && !m) return null;
    const v = (rgb ? [1, 2, 3].map((i) => +rgb[i] / 255) : [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16) / 255))
      .map((x) => (x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4));
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  };
  const BOX = lum("#15181D");
  const texts = [...doc.querySelectorAll(".diagram-box svg text")].filter((t) => t.getBoundingClientRect().width > 0 && t.textContent.trim());
  const small = new Set(), faint = new Set();
  texts.forEach((t) => {
    const size = parseFloat(win.getComputedStyle(t).fontSize) * (t.getScreenCTM() ? t.getScreenCTM().a : 1);
    if (size > 1 && size < 10.95) small.add(`${t.textContent.trim().slice(0, 12)}@${size.toFixed(1)}`);
    // The colour actually shown (a stylesheet rule can override the
    // attribute). Text darker than the box sits on a light fill of its own —
    // a marking on a part, a value in a bar — so it is not measured here.
    const fill = win.getComputedStyle(t).fill;
    const L = lum(fill);
    if (L !== null && L > 0.03 && (L + 0.05) / (BOX + 0.05) < 4.5) faint.add(`${t.textContent.trim().slice(0, 12)}(${fill})`);
  });
  const boxes = texts.map((t) => ({ t, b: t.getBoundingClientRect() }));
  const overlaps = [];
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const a = boxes[i].b, c = boxes[j].b;
    const ox = Math.min(a.right, c.right) - Math.max(a.left, c.left), oy = Math.min(a.bottom, c.bottom) - Math.max(a.top, c.top);
    if (ox > 1.5 && oy > 1.5) overlaps.push(`"${boxes[i].t.textContent.trim().slice(0, 10)}"/"${boxes[j].t.textContent.trim().slice(0, 10)}"`);
  }
  // Text running past the edge of its own drawing is cut off on screen.
  // The box of a line of text includes room above the capitals and below
  // the baseline that the glyphs rarely fill, so top and bottom get 3 px of
  // slack; the sides get none.
  const cut = texts.map((t) => {
    const svg = t.ownerSVGElement, vb = svg && svg.viewBox.baseVal;
    if (!vb || !vb.width) return null;
    const b = t.getBBox();
    const over = Math.max(vb.x - b.x, b.x + b.width - (vb.x + vb.width), vb.y - b.y - 3, b.y + b.height - (vb.y + vb.height) - 3);
    return over > 0.5 ? `${t.textContent.trim().slice(0, 12)}+${over.toFixed(1)}px` : null;
  }).filter(Boolean);
  if (cut.length) r.notes.push(`${cut.length} drawing text(s) cut by the drawing's edge: ${cut.slice(0, 4).join(", ")}`);
  if (small.size) r.notes.push(`${small.size} drawing text(s) under 11 px: ${[...small].slice(0, 4).join(", ")}`);
  if (faint.size) r.notes.push(`${faint.size} drawing text(s) under 4.5:1 contrast: ${[...faint].slice(0, 3).join(", ")}`);
  if (overlaps.length) r.notes.push(`${overlaps.length} overlapping label pair(s): ${overlaps.slice(0, 2).join(", ")}`);

  const tab = doc.querySelector(".tabbar");
  const res = firstResult(doc);
  if (tab && res) {
    const gap = tab.getBoundingClientRect().top - res.getBoundingClientRect().bottom;
    r.clearance = Math.round(gap);
    if (gap < 0) r.problems.push(`first result is ${Math.round(-gap)} px under the tab bar`);
  }

  for (const c of (CHECK_CASES[t.calc] || [])) {
    r.cases++;
    try {
      // Each case starts from the tool's own defaults: no unit remembered
      // from an earlier case.
      win.localStorage.removeItem("cc_prefs");
      win.location.hash = "#/home";
      await wait(40);
      win.location.hash = `#/tool/${encodeURIComponent(t.route)}/${t.calc}`;
      await wait(80);
      await play(doc, c.do || []);
      for (let [sel, expected] of c.expect) {
        const el = doc.querySelector(sel);
        // A field or picker is read by its value; "options:" compares a
        // picker's list of options instead; anything else by its text.
        const opts = expected.startsWith("options:");
        const actual = !el ? "(missing)" : opts ? el.textContent.trim()
          : el.tagName === "INPUT" || el.tagName === "SELECT" ? el.value : el.textContent.trim();
        if (opts) expected = expected.slice(8);
        if (!matches(actual, expected)) r.failed.push(`${c.name}: ${sel} is "${actual}", expected "${expected}"`);
      }
    } catch (e) {
      r.failed.push(`${c.name}: ${e.message}`);
    }
  }
  if (errors.length) r.problems.push(...errors.map((e) => `JS error: ${e}`));
  return r;
}

async function main() {
  // The frame starts as about:blank, which is already "complete"; wait for
  // the app itself to have drawn its home screen.
  // (DOMAINS is a top-level const, so it is not on the window to test for.)
  while (!(frame.contentDocument.URL.includes("index.html") && frame.contentDocument.querySelector(".tabbar"))) await wait(50);
  const win = frame.contentWindow;
  win.addEventListener("error", (e) => (win.__errors || []).push(e.message));
  const origError = win.console.error;
  win.console.error = (...a) => { (win.__errors || []).push(a.join(" ")); origError.apply(win.console, a); };
  // Chrome is started with a fresh profile each run, so no service worker
  // from an earlier session can answer with an old app.

  const report = [];
  for (const t of tools()) report.push(await checkTool(t));
  document.getElementById("report").textContent = "REPORT" + JSON.stringify(report) + "END";
}
main().catch((e) => { document.getElementById("report").textContent = "REPORT" + JSON.stringify({ fatal: String(e) }) + "END"; });
</script>
</body>
</html>
