<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover was only needed to draw content under the status
       bar for black-translucent, which is no longer in use — and it's also
       specifically implicated in reports of this exact standalone-launch
       viewport bug on Pro Max iPhones, so it's worth dropping now that
       nothing here still depends on it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  <title>Circuit Codex</title>
  <meta name="description" content="Electronics reference and tools" />

  <!-- PWA / iOS home screen -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0B0D10" />
  <!-- The apple-mobile-web-app-* tags are the old, pre-manifest.json,
       Apple-only mechanism for "Add to Home Screen". iOS 16.4+ also reads
       manifest.json directly (confirmed: the add-to-home-screen sheet now
       offers "Open as Web App", the modern manifest-driven wording) — and
       manifest.json already declares display/theme/background/icons on its
       own. Dropping the legacy tags is a bet that the 344px/125%-zoom bug
       on standalone launch (confirmed NOT caused by Display Zoom, Larger
       Text, or Safari's per-site zoom — all checked and ruled out) lives in
       that old code path, and that the manifest-only route avoids it. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <!-- ?v= must match sw.js's VERSION on every deploy that touches these files:
       GitHub Pages caches assets for 10 minutes, and a stale query string is
       a stale URL as far as that cache is concerned — this is what makes an
       update visible on reload instead of waiting out the cache or
       reinstalling the app. -->
  <link rel="stylesheet" href="css/styles.css?v=385" />
</head>
<body>
  <div id="app"></div>

  <script src="js/data.js?v=385"></script>
  <script src="js/formulas.js?v=385"></script>
  <script src="js/app.js?v=385"></script>
  <script>
    // Skip the service worker entirely on localhost/a dev server — it's what
    // was making live edits look like no-ops during development (a new SW
    // has to be fetched, installed, and take control before its fresh cache
    // is what answers requests; a plain reload doesn't reliably force that
    // sequence). Production (GitHub Pages) still registers it normally.
    const isLocalDev = ["localhost", "127.0.0.1", "0.0.0.0", ""].includes(location.hostname);
    if ("serviceWorker" in navigator && !isLocalDev) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    } else if ("serviceWorker" in navigator && isLocalDev) {
      // Also unregister any SW a previous (pre-fix) local session already
      // installed, so this takes effect immediately instead of only on the
      // next fresh profile.
      navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
    }
  </script>
</body>
</html>
