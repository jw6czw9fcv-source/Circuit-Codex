<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Circuit Codex</title>
  <meta name="description" content="Electronics reference and tools" />

  <!-- PWA / iOS home screen -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0B0D10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- black-translucent draws the webview full-bleed under the status bar
       (why the topbar needed its own safe-area-inset-top padding), but it's
       also the specific combination — with viewport-fit=cover, on a Dynamic
       Island phone, standalone launch only — behind a known WebKit bug where
       the initial scale computes at 125% instead of 100%. default lets iOS
       reserve and draw its own opaque status bar instead, which sidesteps
       the bug entirely. "black" (not "default", which draws a white bar
       that would clash with this dark theme) keeps an opaque dark status
       bar and reserves its own space, at the cost of losing the full-bleed
       look up top. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Circuit Codex" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <!-- ?v= must match sw.js's VERSION on every deploy that touches these files:
       GitHub Pages caches assets for 10 minutes, and a stale query string is
       a stale URL as far as that cache is concerned — this is what makes an
       update visible on reload instead of waiting out the cache or
       reinstalling the app. -->
  <link rel="stylesheet" href="css/styles.css?v=14" />
</head>
<body>
  <div id="app"></div>

  <script src="js/data.js?v=14"></script>
  <script src="js/formulas.js?v=14"></script>
  <script src="js/app.js?v=14"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
